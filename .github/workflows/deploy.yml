name: Deploy Backend to Cloudflare Workers

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 🚀 Upgraded to meet Wrangler's requirements!
          cache: 'pnpm'
          cache-dependency-path: 'job-server/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd job-server
          pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Deploy to Cloudflare Staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd job-server
          npx wrangler deploy --env staging
name: Deploy Backend to Cloudflare Workers

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 9  # Matches your workspace lockfile

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Deploy Hono Server via Wrangler Action
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Points the deploy action directly to your backend folder
          workingDirectory: 'job-server'